name: Corpi veri

on:
  push:
    branches: [prove]
    paths:
      - "strumenti/collaudo_corpi.py"
      - ".github/workflows/corpi.yml"
      - "officina/corpi/sam3.py"
      - "officina/corpi/rtmw.py"
      - "officina/corpi/rilevatore.py"
      - "officina/corpi/scaricamento.py"
      - "officina/ritocco/scelta.py"
      - "officina/ritocco/segui.py"
      - "officina/ritocco/filmato.py"
  workflow_dispatch:
    inputs:
      quante:
        description: "foto pubbliche COCO da provare"
        type: number
        default: 40
      parte:
        description: "tutto (SAM 3 e RTMW), solo i punti di RTMW, i clic di SAM 3 per il ritocco, SAM 3 che segue nei video, oppure le parti del corpo a parole"
        type: choice
        options: [tutto, punti, clic, segui, parti, gara31]
        default: tutto

permissions:
  contents: read

concurrency:
  group: corpi-${{ github.ref }}-${{ github.event.inputs.parte || 'tutto' }}
  cancel-in-progress: true

jobs:
  collaudo:
    name: SAM 3 e RTMW su foto COCO (${{ github.event.inputs.parte || 'tutto' }})
    if: github.event.inputs.parte != 'gara31'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Le librerie
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install -r requirements.txt transformers==5.18.0 safetensors==0.8.0 \
            huggingface-hub==1.33.0 onnxruntime==1.24.1 opencv-python-headless==4.14.0.94 pycocotools \
            av==16.1.0
      - name: Il collaudo
        id: collaudo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -o pipefail
          python strumenti/collaudo_corpi.py --cartella "$RUNNER_TEMP/corpi" \
            --quante "${{ github.event.inputs.quante || '40' }}" \
            --parte "${{ github.event.inputs.parte || 'tutto' }}" --uscita corpi-collaudo.json \
            2>&1 | tee "$RUNNER_TEMP/collaudo.log"
      - name: Com'è andato
        if: always()
        run: |
          python strumenti/annota_il_guasto.py "$RUNNER_TEMP/collaudo.log" \
            --esito corpi-collaudo.json --com-e-andato "${{ steps.collaudo.outcome }}"
      - name: Cosa ha detto
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpi-collaudo
          path: corpi-collaudo.json
          if-no-files-found: ignore
          retention-days: 1

  gara31_pesi:
    if: github.event.inputs.parte == 'gara31'
    name: I pesi, con la chiave e senza codice di Meta
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Le librerie
        run: python -m pip install -r requirements.txt huggingface-hub==1.33.0
      - name: Scarica e controlla le impronte
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python strumenti/gara_sam31_parti.py --fai pesi --cartella "$RUNNER_TEMP/pesi" \
            --uscita pesi.json
          mkdir -p "$RUNNER_TEMP/p31" "$RUNNER_TEMP/p3"
          mv "$RUNNER_TEMP/pesi/sam3.1_multiplex.pt" "$RUNNER_TEMP/p31/"
          mv "$RUNNER_TEMP/pesi/sam3.pt" "$RUNNER_TEMP/p3/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pesi-sam31
          path: ${{ runner.temp }}/p31/sam3.1_multiplex.pt
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pesi-sam3
          path: ${{ runner.temp }}/p3/sam3.pt
          compression-level: 0
          retention-days: 1

  gara31_sam3:
    if: github.event.inputs.parte == 'gara31'
    name: SAM 3 come nel programma
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Le librerie
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install -r requirements.txt transformers==5.18.0 safetensors==0.8.0 \
            huggingface-hub==1.33.0 onnxruntime==1.24.1 opencv-python-headless==4.14.0.94 \
            pycocotools av==16.1.0
      - name: La corsa
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python strumenti/gara_sam31_parti.py --fai corri --chi sam3 \
            --cartella "$RUNNER_TEMP/gara" --quante "${{ github.event.inputs.quante || '200' }}" \
            --uscita sam3.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: esito-sam3
          path: sam3.json
          if-no-files-found: ignore
          retention-days: 3

  gara31_meta:
    if: github.event.inputs.parte == 'gara31'
    name: ${{ matrix.chi }} con il codice di Meta, senza chiave
    needs: gara31_pesi
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        chi: [sam31, sam3meta]
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.chi == 'sam31' && 'pesi-sam31' || 'pesi-sam3' }}
          path: ${{ runner.temp }}/pesi
      - name: Le librerie e il codice di Meta
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install -r requirements.txt timm==1.0.31 einops==0.8.2 ftfy==6.1.1 \
            regex iopath==0.1.10 "setuptools<81" huggingface-hub==1.33.0 \
            opencv-python-headless==4.14.0.94 pycocotools tqdm typing_extensions \
            psutil scipy
          git clone -q https://github.com/facebookresearch/sam3 "$RUNNER_TEMP/sam3-meta"
          git -C "$RUNNER_TEMP/sam3-meta" checkout -q f1647e8d0c1d280991f4d1b7d974c2704537fe66
      - name: La corsa
        run: |
          python strumenti/gara_sam31_parti.py --fai corri --chi "${{ matrix.chi }}" \
            --cartella "$RUNNER_TEMP/gara" --quante "${{ github.event.inputs.quante || '200' }}" \
            --codice "$RUNNER_TEMP/sam3-meta" --pesi "$RUNNER_TEMP/pesi" \
            --uscita "${{ matrix.chi }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: esito-${{ matrix.chi }}
          path: ${{ matrix.chi }}.json
          if-no-files-found: ignore
          retention-days: 3

  gara31_confronto:
    name: Il confronto
    needs: [gara31_sam3, gara31_meta]
    if: always() && github.event.inputs.parte == 'gara31'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: esito-*
          merge-multiple: true
      - name: Le tabelle
        run: |
          python strumenti/gara_sam31_parti.py --fai confronta --uscita gara-sam31-parti.json \
            sam3.json sam31.json sam3meta.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gara-sam31-parti
          path: gara-sam31-parti.json
          retention-days: 3
