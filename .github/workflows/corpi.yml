name: Corpi veri

on:
  push:
    branches: [prove]
    paths:
      - "strumenti/collaudo_corpi.py"
      - ".github/workflows/corpi.yml"
      - "officina/corpi/sam3.py"
      - "officina/corpi/rtmw.py"
      - "officina/corpi/rilevatore.py"
      - "officina/corpi/scaricamento.py"
  workflow_dispatch:
    inputs:
      quante:
        description: "foto pubbliche COCO da provare"
        type: number
        default: 40
      parte:
        description: "tutto (SAM 3 e RTMW) oppure solo i punti di RTMW, più veloce"
        type: choice
        options: [tutto, punti]
        default: tutto

permissions:
  contents: read

concurrency:
  group: corpi-${{ github.ref }}-${{ github.event.inputs.parte || 'tutto' }}
  cancel-in-progress: true

jobs:
  collaudo:
    name: SAM 3 e RTMW su foto COCO (${{ github.event.inputs.parte || 'tutto' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Le librerie
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install -r requirements.txt transformers==5.18.0 safetensors==0.8.0 \
            huggingface-hub==1.33.0 onnxruntime==1.24.1 opencv-python-headless==4.14.0.94 pycocotools
      - name: Il collaudo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python strumenti/collaudo_corpi.py --cartella "$RUNNER_TEMP/corpi" \
            --quante "${{ github.event.inputs.quante || '40' }}" \
            --parte "${{ github.event.inputs.parte || 'tutto' }}" --uscita corpi-collaudo.json
      - name: Cosa ha detto
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpi-collaudo
          path: corpi-collaudo.json
          if-no-files-found: ignore
