name: Corpi veri

on:
  push:
    branches: [prove]
    paths:
      - "strumenti/collaudo_corpi.py"
      - ".github/workflows/corpi.yml"
      - "officina/corpi/sam3.py"
      - "officina/corpi/rtmw.py"
      - "officina/corpi/rilevatore.py"
      - "officina/corpi/scaricamento.py"
  workflow_dispatch:
    inputs:
      quante:
        description: "foto pubbliche COCO da provare"
        default: "40"

permissions:
  contents: read

concurrency:
  group: corpi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collaudo:
    name: SAM 3 e RTMW su foto COCO
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Le librerie
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install -r requirements.txt transformers==5.18.0 safetensors==0.8.0 \
            huggingface-hub==1.33.0 onnxruntime==1.24.1 opencv-python-headless==4.14.0.94 pycocotools
      - name: Il collaudo
        run: |
          python strumenti/collaudo_corpi.py --cartella "$RUNNER_TEMP/corpi" \
            --quante "${{ github.event.inputs.quante || '40' }}" --uscita corpi-collaudo.json
      - name: Cosa ha detto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpi-collaudo
          path: corpi-collaudo.json
          if-no-files-found: ignore
