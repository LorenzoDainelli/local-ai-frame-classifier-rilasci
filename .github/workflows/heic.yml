name: HEIC

on:
  push:
    branches: [prove]
    paths:
      - "strumenti/collaudo_heic.py"
      - "strumenti/collaudo_heic.swift"
      - "officina/miglioria/heif_scatole.py"
      - "officina/miglioria/metadati.py"
      - "officina/miglioria/profonda.py"
      - "officina/miglioria/catena.py"
      - "strumenti/collaudo_profonda.py"
      - ".github/workflows/heic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  heic:
    name: Mappa HDR e profondità viste da macOS
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Le librerie
        run: |
          grep -E "^(pillow|pillow-heif|numpy)==" requirements.txt | cut -d" " -f1 > heic-librerie.txt
          cat heic-librerie.txt
          echo "pypng==0.20220715.0" >> heic-librerie.txt
          python -m pip install -r heic-librerie.txt
          python -c "import numpy, pillow_heif; print(pillow_heif.__version__)"
      - name: Il programma che guarda come macOS
        run: |
          sw_vers
          swiftc -O strumenti/collaudo_heic.swift -o "$RUNNER_TEMP/collaudo_heic"
      - name: Il collaudo
        run: python strumenti/collaudo_heic.py --cartella "$RUNNER_TEMP/heic" --programma "$RUNNER_TEMP/collaudo_heic" --uscita heic-collaudo.json
      - name: I 10 bit
        if: always()
        run: python strumenti/collaudo_profonda.py --cartella "$RUNNER_TEMP/profonda" --programma "$RUNNER_TEMP/collaudo_heic" --uscita heic-profonda.json
      - name: Cosa ha detto
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: heic-collaudo
          path: |
            heic-collaudo.json
            heic-profonda.json
          if-no-files-found: ignore
          retention-days: 1
