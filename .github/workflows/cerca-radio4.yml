name: Cerca i file di C-RADIOv4-H per le impronte

on:
  push:
    branches: [prove]
    paths:
      - strumenti/cerca_radio4.py
      - .github/workflows/cerca-radio4.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cerca:
    name: Licenza, file, impronte e forma di C-RADIOv4-H
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install transformers huggingface_hub safetensors sentencepiece protobuf pillow numpy timm einops open_clip_torch
      - run: python strumenti/cerca_radio4.py --uscita cerca-radio4.txt
