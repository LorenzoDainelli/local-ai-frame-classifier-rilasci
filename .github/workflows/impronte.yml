name: Impronte da fissare

on:
  push:
    branches: [prove]
    paths:
      - "strumenti/impronte_da_fissare.py"
      - ".github/workflows/impronte.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  impronte:
    name: Revisioni e impronte di Python e dei modelli
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: La libreria di Hugging Face
        run: python -m pip install huggingface-hub==1.33.0
      - name: Le impronte
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python strumenti/impronte_da_fissare.py --uscita impronte.json --cartella "$RUNNER_TEMP/impronte"
