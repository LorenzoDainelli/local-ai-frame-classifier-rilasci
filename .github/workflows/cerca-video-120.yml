name: Cerca i video per la gara dei 120 FPS

on:
  push:
    branches: [prove]
    paths:
      - strumenti/cerca_video_120.py
      - .github/workflows/cerca-video-120.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cerca:
    name: Dove sono i video veloci, quanto pesano, che licenza hanno
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install huggingface_hub
      - run: python strumenti/cerca_video_120.py --uscita cerca-video-120.txt --piano
