name: Cerca le foto con i volti per la prova di velocità

on:
  push:
    branches: [prove]
    paths:
      - strumenti/cerca_wider.py
      - .github/workflows/cerca-wider.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cerca:
    name: WIDER FACE, dove sta, impronte e sei foto difficili
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install huggingface_hub pillow
      - run: python strumenti/cerca_wider.py --uscita cerca-wider.txt
