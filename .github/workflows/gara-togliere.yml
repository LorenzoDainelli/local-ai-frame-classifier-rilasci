name: Gara del togliere

on:
  push:
    branches: [prove]
    paths:
      - "strumenti/gara_togliere.py"
      - ".github/workflows/gara-togliere.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esplora:
    name: Cosa c'è davvero
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install huggingface_hub pyarrow
      - name: Candidati e foto
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python strumenti/gara_togliere.py dentro
