name: Gara parti del corpo SAM 3 contro SAM 3.1

on:
  workflow_dispatch:
    inputs:
      quante:
        description: "foto pubbliche COCO"
        type: number
        default: 200

permissions:
  contents: read

concurrency:
  group: gara-sam31-parti-${{ github.ref }}
  cancel-in-progress: true

env:
  CODICE_META: f1647e8d0c1d280991f4d1b7d974c2704537fe66

jobs:
  pesi:
    name: I pesi, con la chiave e senza codice di Meta
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Le librerie
        run: python -m pip install -r requirements.txt huggingface-hub==1.33.0
      - name: Scarica e controlla le impronte
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python strumenti/gara_sam31_parti.py --fai pesi --cartella "$RUNNER_TEMP/pesi" \
            --uscita pesi.json
          mkdir -p "$RUNNER_TEMP/p31" "$RUNNER_TEMP/p3"
          mv "$RUNNER_TEMP/pesi/sam3.1_multiplex.pt" "$RUNNER_TEMP/p31/"
          mv "$RUNNER_TEMP/pesi/sam3.pt" "$RUNNER_TEMP/p3/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pesi-sam31
          path: ${{ runner.temp }}/p31/sam3.1_multiplex.pt
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pesi-sam3
          path: ${{ runner.temp }}/p3/sam3.pt
          compression-level: 0
          retention-days: 1

  sam3:
    name: SAM 3 come nel programma
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Le librerie
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install -r requirements.txt transformers==5.18.0 safetensors==0.8.0 \
            huggingface-hub==1.33.0 onnxruntime==1.24.1 opencv-python-headless==4.14.0.94 \
            pycocotools av==16.1.0
      - name: La corsa
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python strumenti/gara_sam31_parti.py --fai corri --chi sam3 \
            --cartella "$RUNNER_TEMP/gara" --quante "${{ github.event.inputs.quante || '200' }}" \
            --uscita sam3.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: esito-sam3
          path: sam3.json
          if-no-files-found: ignore
          retention-days: 3

  meta:
    name: ${{ matrix.chi }} con il codice di Meta, senza chiave
    needs: pesi
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        chi: [sam31, sam3meta]
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.chi == 'sam31' && 'pesi-sam31' || 'pesi-sam3' }}
          path: ${{ runner.temp }}/pesi
      - name: Le librerie e il codice di Meta
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install -r requirements.txt timm==1.0.31 einops==0.8.2 ftfy==6.1.1 \
            regex iopath==0.1.10 "setuptools<81" huggingface-hub==1.33.0 \
            opencv-python-headless==4.14.0.94 pycocotools tqdm typing_extensions
          git clone -q https://github.com/facebookresearch/sam3 "$RUNNER_TEMP/sam3-meta"
          git -C "$RUNNER_TEMP/sam3-meta" checkout -q "$CODICE_META"
      - name: La corsa
        run: |
          python strumenti/gara_sam31_parti.py --fai corri --chi "${{ matrix.chi }}" \
            --cartella "$RUNNER_TEMP/gara" --quante "${{ github.event.inputs.quante || '200' }}" \
            --codice "$RUNNER_TEMP/sam3-meta" --pesi "$RUNNER_TEMP/pesi" \
            --uscita "${{ matrix.chi }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: esito-${{ matrix.chi }}
          path: ${{ matrix.chi }}.json
          if-no-files-found: ignore
          retention-days: 3

  confronto:
    name: Il confronto
    needs: [sam3, meta]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: esito-*
          merge-multiple: true
      - name: Le tabelle
        run: |
          python strumenti/gara_sam31_parti.py --fai confronta --uscita gara-sam31-parti.json \
            sam3.json sam31.json sam3meta.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gara-sam31-parti
          path: gara-sam31-parti.json
          retention-days: 3
