name: Obiettivo con Puffin

on:
  push:
    branches: [prove]
    paths:
      - "strumenti/collaudo_obiettivo.py"
      - ".github/workflows/obiettivo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obiettivo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  esplora:
    name: Com'è fatto Puffin
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Le librerie
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install huggingface_hub numpy
      - name: Guarda
        run: python strumenti/collaudo_obiettivo.py esplora --uscita obiettivo-esplora.json
