name: Verifica C-RADIOv4-H del programma contro l'originale NVIDIA

on:
  push:
    branches: [prove]
    paths:
      - strumenti/verifica_radio4.py
      - officina/descrittori/radio4.py
      - .github/workflows/verifica-radio4.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifica:
    name: Stessi numeri di NVIDIA su foto pubbliche e frasi
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h / /mnt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install transformers huggingface_hub safetensors sentencepiece protobuf pillow numpy timm einops open_clip_torch
      - run: python strumenti/verifica_radio4.py --uscita verifica-radio4.txt
      - if: always()
        run: df -h / /mnt
