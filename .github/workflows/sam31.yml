name: SAM 3.1

on:
  push:
    branches: [prove]
    paths:
      - "strumenti/guarda_sam31.py"
      - ".github/workflows/sam31.yml"
      - "officina/ritocco/sam31.py"
      - "officina/ritocco/sam31_pezzi.py"
      - "officina/ritocco/segui.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sam31-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guarda:
    name: Com'è fatto il file di SAM 3.1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Le librerie
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install huggingface_hub
      - name: Il file
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python strumenti/guarda_sam31.py --uscita sam31.json
      - name: Cosa ha detto
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sam31
          path: sam31.json
          if-no-files-found: ignore
          retention-days: 1
  confronta:
    name: I pezzi vanno al posto giusto e segue un video finto
    needs: guarda
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sam31
      - name: Le librerie e il codice di Meta
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install timm==1.0.31 einops==0.8.2 opencv-python-headless==4.14.0.94 \
            numpy==2.4.6 pillow==13.0.0 tqdm typing_extensions
          git clone -q https://github.com/facebookresearch/sam3 sam3-originale
          git -C sam3-originale checkout -q f1647e8d0c1d280991f4d1b7d974c2704537fe66
      - name: Il confronto
        run: |
          python strumenti/guarda_sam31.py --confronta sam3-originale --letto sam31.json \
            --uscita sam31-confronto.json
