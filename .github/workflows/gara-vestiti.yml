name: Gara dei vestiti

on:
  push:
    branches: [prove]
    paths:
      - strumenti/gara_vestiti.py
      - .github/workflows/gara-vestiti.yml
  workflow_dispatch:
    inputs:
      schema:
        description: "raccolte di Hugging Face da guardare dentro, separate da virgole"
        default: "detection-datasets/fashionpedia"

permissions:
  contents: read

concurrency:
  group: gara-vestiti-${{ github.ref }}
  cancel-in-progress: true

jobs:
  esplora:
    name: Dove sono le foto
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install huggingface_hub pyarrow
      - name: Cerca
        if: false
        env:
          SCHEMA: ${{ github.event.inputs.schema || 'detection-datasets/fashionpedia' }}
        run: python strumenti/gara_vestiti.py esplora --schema "$SCHEMA"
      - name: Le etichette
        run: python strumenti/gara_vestiti.py etichette
