name: Versione 2

on:
  push:
    branches: [prove]
    paths:
      - "officina/**"
      - "installatore/**"
      - "prove/**"
      - "requirements*.txt"
      - "strumenti/collaudo_recupera.py"
      - ".github/workflows/versione-2.yml"
  workflow_dispatch:
    inputs:
      canale:
        description: "beta oppure finale"
        type: choice
        options: [beta, finale]
        default: beta
      pubblica:
        description: "pubblica il rilascio"
        type: choice
        options: ["si", "no"]
        default: "si"
      motori:
        description: "scarica e prova davvero torch e le librerie dei modelli"
        type: choice
        options: ["no", "si"]
        default: "no"
      kpr:
        description: "scarica KPR da Google Drive e confrontalo con l'originale"
        type: choice
        options: ["no", "si"]
        default: "no"

permissions:
  contents: read

concurrency:
  group: versione-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: Prove su Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-sviluppo.txt
      - run: python -m pytest prove -q -p no:cacheprovider

  falle:
    name: Librerie con falle note
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit==2.9.0
      - name: Controlla le librerie del programma
        run: python -m pip_audit -r installatore/librerie-del-programma.txt --require-hashes --disable-pip --progress-spinner off --desc on
      - name: Controlla le librerie di «Recupera foto.exe»
        run: python -m pip_audit -r installatore/librerie-di-recupera.txt --require-hashes --disable-pip --progress-spinner off --desc on
      - name: Controlla le librerie dei modelli
        run: python -m pip_audit -r requirements-modelli.txt --progress-spinner off --desc on --no-deps

  costruzione:
    name: Costruzione dell'installatore
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
    outputs:
      versione: ${{ steps.versione.outputs.versione }}
      canale: ${{ steps.versione.outputs.canale }}
      impronta: ${{ steps.impronta.outputs.impronta }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Numero di versione
        id: versione
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOSITO_RILASCI: ${{ vars.RILASCI_DEPOSITO || github.repository }}
          CANALE_CHIESTO: ${{ inputs.canale }}
          NUMERO_DEL_GIRO: ${{ github.run_number }}
        run: |
          CANALE="${CANALE_CHIESTO:-beta}"
          case "$CANALE" in beta|finale) ;; *) echo "canale sconosciuto" >&2; exit 1 ;; esac
          [[ "$NUMERO_DEL_GIRO" =~ ^[0-9]+$ ]] || exit 1
          ULTIMO=$(gh release list --repo "$DEPOSITO_RILASCI" --limit 100 --json tagName \
            --jq '[.[].tagName | capture("(?<n>[0-9]+)$").n | tonumber] | max // 0')
          [[ "$ULTIMO" =~ ^[0-9]+$ ]] || exit 1
          NUMERO=$NUMERO_DEL_GIRO
          if [ "$NUMERO" -le "$ULTIMO" ]; then NUMERO=$((ULTIMO + 1)); fi
          if [ "$CANALE" = "finale" ]; then
            VERSIONE="2.0.$NUMERO"
          else
            VERSIONE="2.0.0-beta.$NUMERO"
          fi
          echo "canale=$CANALE" >> "$GITHUB_OUTPUT"
          echo "versione=$VERSIONE" >> "$GITHUB_OUTPUT"
          echo "numerica=2.0.0.$NUMERO" >> "$GITHUB_OUTPUT"

      - name: Prepara Python, librerie e programma
        env:
          VERSIONE: ${{ steps.versione.outputs.versione }}
          CANALE: ${{ steps.versione.outputs.canale }}
          DEPOSITO_RILASCI: ${{ vars.RILASCI_DEPOSITO || github.repository }}
        run: python installatore/prepara.py --versione "$env:VERSIONE" --canale "$env:CANALE" --commit "${{ github.sha }}" --rilasci "$env:DEPOSITO_RILASCI"

      - name: Collaudo del pacchetto
        run: |
          costruzione\python\python.exe -m officina.programma --collaudo collaudo-pacchetto.json
          if ($LASTEXITCODE -ne 0) { Get-Content collaudo-pacchetto.json; exit 1 }

      - name: Collaudo con la finestra vera
        timeout-minutes: 6
        run: |
          costruzione\python\python.exe -m officina.programma --collaudo collaudo-finestra.json --finestra
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Collaudo con la finestra vera e il forziere
        timeout-minutes: 6
        run: |
          costruzione\python\python.exe -m officina.programma --collaudo collaudo-forziere.json --forziere
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Costruisci «Recupera foto.exe»
        run: |
          python -m pip install --require-hashes --only-binary :all: --no-deps -r installatore\librerie-di-recupera.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $casa = (Get-Location).Path
          $lavoro = Join-Path $env:RUNNER_TEMP "pyinstaller"
          $icona = Join-Path $casa "officina\web\statici\officina.ico"
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --name "Recupera foto" --icon $icona --add-data "${icona}:." --paths $casa --distpath (Join-Path $casa "costruzione\app\strumenti") --workpath (Join-Path $lavoro "lavoro") --specpath $lavoro (Join-Path $casa "installatore\recupera_foto.py")
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path -LiteralPath "costruzione\app\strumenti\Recupera foto.exe")) { Write-Output "manca «Recupera foto.exe»"; exit 1 }

      - name: Collaudo di «Recupera foto.exe» su una chiavetta finta
        timeout-minutes: 20
        run: |
          $base = Join-Path $env:RUNNER_TEMP "recupera"
          python strumenti\collaudo_recupera.py prepara $base --programmino "costruzione\app\strumenti\Recupera foto.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $programmino = Join-Path $base "chiavetta\Recupera foto.exe"
          $codici = @()
          foreach ($nome in @("senza-finestra", "finestra", "sbagliata")) {
            $richiesta = Join-Path $base "richieste\$nome.json"
            $giro = Start-Process -FilePath $programmino -ArgumentList @("--collaudo", "`"$richiesta`"") -WorkingDirectory $env:RUNNER_TEMP -PassThru
            $null = $giro.Handle
            if ($giro.WaitForExit(300000)) {
              $giro.WaitForExit()
              $codici += @("--codice", "$nome=$($giro.ExitCode)")
            } else {
              Write-Output "$nome non ha finito in cinque minuti"
              Stop-Process -Id $giro.Id -Force -ErrorAction SilentlyContinue
              $codici += @("--codice", "$nome=99")
            }
          }
          python strumenti\collaudo_recupera.py verifica $base --congelato @codici
          $uscita = $LASTEXITCODE
          foreach ($esito in Get-ChildItem (Join-Path $base "esiti") -Filter *.json -ErrorAction SilentlyContinue) {
            Copy-Item -LiteralPath $esito.FullName "collaudo-recupera-$($esito.Name)"
          }
          exit $uscita

      - name: Costruisci l'installatore
        env:
          VERSIONE: ${{ steps.versione.outputs.versione }}
          NUMERICA: ${{ steps.versione.outputs.numerica }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { Write-Output "su questa macchina di GitHub manca Inno Setup 6"; exit 1 }
          & $iscc "/DVersione=$env:VERSIONE" "/DVersioneNumerica=$env:NUMERICA" installatore\local-ai-frame-classifier.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Impronta dell'installatore
        id: impronta
        shell: bash
        env:
          VERSIONE: ${{ steps.versione.outputs.versione }}
        run: |
          python installatore/prepara.py --versione x --impronta "uscita/local-ai-frame-classifier-$VERSIONE.exe"
          IMPRONTA=$(cut -d ' ' -f 1 "uscita/local-ai-frame-classifier-$VERSIONE.exe.sha256")
          [[ "$IMPRONTA" =~ ^[0-9a-f]{64}$ ]] || exit 1
          echo "impronta=$IMPRONTA" >> "$GITHUB_OUTPUT"

      - name: Cosa hanno detto i collaudi
        if: always()
        run: |
          foreach ($file in Get-ChildItem collaudo-*.json -ErrorAction SilentlyContinue) {
            Write-Output "===== $($file.Name)"
            Get-Content $file
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 3
          name: installatore
          path: |
            uscita/*.exe
            uscita/*.sha256
          if-no-files-found: error

  collaudo:
    name: Collaudo dell'installatore su Windows
    needs: costruzione
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Prove del programma su Windows
        run: |
          python -m pip install -r requirements-sviluppo.txt
          python -m pytest prove/test_programma.py prove/test_programma_finestre.py prove/test_sicuro_recupera.py -q -p no:cacheprovider

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installatore
          path: uscita

      - name: Installa in silenzio, collauda, disinstalla
        env:
          VERSIONE: ${{ needs.costruzione.outputs.versione }}
          IMPRONTA: ${{ needs.costruzione.outputs.impronta }}
        run: |
          $installatore = "uscita\local-ai-frame-classifier-$env:VERSIONE.exe"
          if ((Get-FileHash -Algorithm SHA256 $installatore).Hash.ToLower() -ne $env:IMPRONTA) { Write-Output "l'installatore non è quello costruito"; exit 1 }
          Start-Process -Wait -FilePath $installatore -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          $casa = Join-Path $env:LOCALAPPDATA "Programs\Local AI Frame Classifier"
          if (-not (Test-Path "$casa\python\pythonw.exe")) { Write-Output "non installato in $casa"; exit 1 }
          $collegamento = Join-Path ([Environment]::GetFolderPath('Programs')) "Local AI Frame Classifier.lnk"
          if (-not (Test-Path $collegamento)) { Write-Output "manca il collegamento nel menu Start"; exit 1 }
          & "$casa\python\python.exe" -m officina.programma --collaudo collaudo-installato.json
          $esito = $LASTEXITCODE
          Start-Process -Wait -FilePath "$casa\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          if (Test-Path "$casa\python") { Write-Output "la disinstallazione ha lasciato python"; exit 1 }
          exit $esito

      - name: Cosa ha detto il collaudo
        if: always()
        run: Get-Content collaudo-installato.json -ErrorAction SilentlyContinue

  pubblica:
    name: Pubblica il rilascio firmato
    needs: [prove, falle, costruzione, collaudo]
    if: github.event_name == 'push' || inputs.pubblica == 'si'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: rilascio
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installatore
          path: uscita

      - name: Controlla e firma l'installatore
        env:
          VERSIONE: ${{ needs.costruzione.outputs.versione }}
          IMPRONTA: ${{ needs.costruzione.outputs.impronta }}
          FIRMA_AGGIORNAMENTI: ${{ secrets.FIRMA_AGGIORNAMENTI }}
        run: |
          NOME="local-ai-frame-classifier-$VERSIONE.exe"
          [ "$(sha256sum "uscita/$NOME" | cut -d ' ' -f 1)" = "$IMPRONTA" ] || { echo "l'installatore non è quello costruito" >&2; exit 1; }
          [ -n "$FIRMA_AGGIORNAMENTI" ] || { echo "manca la chiave di firma nell'ambiente «rilascio»" >&2; exit 1; }
          umask 077
          CHIAVE="$RUNNER_TEMP/firma.pem"
          printf '%s\n' "$FIRMA_AGGIORNAMENTI" > "$CHIAVE"
          PUBBLICA=$(openssl pkey -in "$CHIAVE" -pubout -outform DER | tail -c 32 | base64 -w0)
          if ! grep -qF "\"$PUBBLICA\"" officina/programma/firma.py; then
            rm -f "$CHIAVE"
            echo "la chiave di firma non è quella scritta nel programma" >&2
            exit 1
          fi
          printf 'local-ai-frame-classifier aggiornamento 1\nversione %s\nfile %s\nsha256 %s\n' \
            "$VERSIONE" "$NOME" "$IMPRONTA" > "$RUNNER_TEMP/messaggio.txt"
          openssl pkeyutl -sign -inkey "$CHIAVE" -rawin -in "$RUNNER_TEMP/messaggio.txt" \
            -out "$RUNNER_TEMP/firma.bin"
          rm -f "$CHIAVE"
          base64 -w0 "$RUNNER_TEMP/firma.bin" > "uscita/$NOME.firma"
          echo "firmato con la chiave $PUBBLICA"

      - name: Pubblica il rilascio
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN_RILASCI: ${{ secrets.RILASCI_TOKEN || github.token }}
          DEPOSITO_RILASCI: ${{ vars.RILASCI_DEPOSITO || github.repository }}
          VERSIONE: ${{ needs.costruzione.outputs.versione }}
          CANALE: ${{ needs.costruzione.outputs.canale }}
        run: |
          SEGNO=""
          if [ "$CANALE" != "finale" ]; then SEGNO="--prerelease"; fi
          git log -1 --pretty=%B > note.txt
          if [ "$DEPOSITO_RILASCI" != "$GITHUB_REPOSITORY" ]; then
            gh release create "v$VERSIONE" uscita/*.exe uscita/*.sha256 uscita/*.firma $SEGNO \
              --target "$GITHUB_SHA" --title "Local AI Frame Classifier $VERSIONE" \
              --notes-file note.txt
          fi
          PESO=$(wc -c < "uscita/local-ai-frame-classifier-$VERSIONE.exe")
          python3 strumenti/vetrina.py --deposito "$DEPOSITO_RILASCI" --versione "$VERSIONE" \
            --peso "$PESO" --note note-pubbliche.md
          GH_TOKEN="$TOKEN_RILASCI" gh release create "v$VERSIONE" uscita/*.exe uscita/*.sha256 uscita/*.firma $SEGNO \
            --repo "$DEPOSITO_RILASCI" --target main --title "Local AI Frame Classifier $VERSIONE" \
            --notes-file note-pubbliche.md
          PYTHON=python3 bash strumenti/vetrina.sh "$VERSIONE" "$PESO"

  motori:
    name: Motori veri su Windows
    if: (github.event_name == 'workflow_dispatch' && inputs.motori == 'si') || contains(github.event.head_commit.message, '[motori]')
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Prepara il pacchetto
        run: python installatore/prepara.py --versione "2.0.0-beta.0" --canale beta
      - name: Scarica, installa e prova i motori
        env:
          OFFICINA_CHIAVE_COLLAUDO: ${{ secrets.HF_TOKEN }}
        run: |
          costruzione\python\python.exe -m officina.programma --collaudo collaudo-motori.json --motori --corpi
          $esito = $LASTEXITCODE
          Get-Content collaudo-motori.json
          exit $esito

  kpr:
    name: KPR confrontato con l'originale
    if: (github.event_name == 'workflow_dispatch' && inputs.kpr == 'si') || contains(github.event.head_commit.message, '[kpr]')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: loro
        with:
          python-version: "3.10"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: L'originale di KPR
        run: |
          git clone https://github.com/VlSomers/keypoint_promptable_reidentification kpr-originale
          git -C kpr-originale checkout e3e6ee2ffb74fd86a39518ce9a25ff91fbd973fa
      - name: Le librerie del programma
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install numpy safetensors pillow opencv-python-headless
      - name: Le librerie dell'originale
        env:
          PY: ${{ steps.loro.outputs.python-path }}
        run: |
          "$PY" -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          "$PY" -m pip install "numpy<2" "opencv-python-headless==4.10.0.84" "albumentations==1.3.1" "torchmetrics==1.3.0" "matplotlib==3.8.4" "pandas<2.3" safetensors pillow scipy yacs tabulate deepdiff timm scikit-image tqdm omegaconf scikit-learn h5py six future tensorboard wandb monai "git+https://github.com/facebookresearch/segment-anything.git@dca509fe793f601edb92606367a655c15ac00fdf" "git+https://github.com/katsura-jp/pytorch-cosine-annealing-with-warmup@12d03c07553aedd3d9e9155e2b3e31ce8c64081a"
      - name: Confronto con l'originale
        env:
          PYTHON_DI_KPR: ${{ steps.loro.outputs.python-path }}
        run: python strumenti/collaudo_kpr.py --kpr kpr-originale --uscita collaudo-kpr.json
      - name: Cosa ha detto
        if: always()
        run: cat collaudo-kpr.json || true
