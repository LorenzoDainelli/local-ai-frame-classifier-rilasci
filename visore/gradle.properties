# Niente rete oltre a quella che serve per scaricare le librerie: nessun
# rapporto d'uso spedito a nessuno (regola 7).
org.gradle.welcome=never
kotlin.code.style=official

# Le librerie di Compose stanno sotto il nome «androidx», che e' la casa nuova:
# Android chiede di dirlo qui, per non mescolarle per sbaglio con quelle
# vecchie (le «android.support» di dieci anni fa). Senza questa riga il
# controllo checkDebugAarMetadata ferma la costruzione dell'app.
android.useAndroidX=true

# E l'altra meta' della stessa faccenda: «jetifier» e' l'arnese che riscrive al
# volo le librerie vecchie per farle sembrare nuove. Qui di librerie vecchie non
# ce n'e' nemmeno una, quindi resta spento: e' un pezzo in meno che tocca il
# codice, e la costruzione e' piu' svelta.
android.enableJetifier=false
